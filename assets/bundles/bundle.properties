unit.ss-novaAT.description = AT1 light support combat mech, fires laser bolts at enemies. Laser bolts can repair buildings but do not repair autonomously, and can repair allied units in an area. Can boost to move quickly, but cannot attack while boosting. Compared to Serpulo units, it has improvements in speed, defense, and damage.

