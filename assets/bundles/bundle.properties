# Vanilla Content Modifications

# Serpulo
# Unit Descriptions
unit.dagger.description = T1 light reconnaissance combat mech, fires continuous standard bullets at enemies.
unit.mace.description = T2 medium standard combat mech, sprays high-temperature flames to melt surface armor.
unit.fortress.description = T3 medium specialized artillery mech, fires long-range shells at ground enemies.
unit.scepter.description = T4 heavy firepower combat mech, rapidly fires electromagnetic bullets at enemies.
unit.reign.description = T5 heavy single-soldier combat mech, fires three-round bursts of large armor-piercing bullets at enemies.
unit.nova.description = T1 light support mech, fires laser bolts at enemies. Laser bolts can repair buildings but do not repair autonomously, and can repair allied units in an area. Can boost to move quickly, but cannot attack while boosting.
unit.pulsar.description = T2 medium standard support mech, fires multiple straight-line electric arcs to paralyze enemies. Arcs can repair buildings but do not repair autonomously, and can grant a temporary shield that increases damage resistance to allied units in range. Can boost to move quickly, but cannot attack while boosting.
unit.quasar.description = T3 medium specialized support mech, fires high-energy laser beams that penetrate enemies. Laser beams can repair buildings but do not repair autonomously. Can boost to move quickly, but cannot attack while boosting. Has a personal holographic shield that blocks incoming bullets and can regenerate when destroyed.
unit.vela.description = T4 heavy firepower support mech, fires a massive continuous high-energy laser beam that melts enemies and causes burning. Do not order it to repair allied buildings to prevent accidents caused by burning. Can boost to move quickly, but cannot attack while boosting. Equipped with two repair devices that autonomously heal allied units in range.
unit.corvus.description = T5 heavy multi-legged single-soldier support mech, charges and fires a giant high-energy laser beam to incinerate enemies ahead and clear the way for allies. Not recommended to order it to repair buildings. Sacrifices boost capability, adding four mechanical legs to traverse most terrain.
unit.crawler.description = T1 light multi-legged quantized self-destruct combat mech, quickly rushes at enemies and self-destructs, causing a large explosion.
unit.atrax.description = T2 medium standard multi-legged combat mech, fires weakening spherical slag liquid to melt targets. Can traverse most terrain.
unit.spiroct.description = T3 medium multi-legged specialized combat mech, fires traction laser beams at enemies that weaken their defense, and self-repairs when hitting a target. Can traverse most terrain.
unit.arkyid.description = T4 heavy multi-legged firepower combat mech, fires large traction laser beams at enemies that weaken their defense and self-repair when hitting a target, and is equipped with two medium charged cluster cannon launchers. Can traverse most terrain.
unit.toxopid.description = T5 heavy multi-legged single-soldier combat mech, fires large charged cluster shells and a three-pronged high-energy laser to melt enemies. Can traverse most terrain.
unit.flare.description = T1 light reconnaissance combat aircraft, rapidly fires lightweight bullets at enemies.
unit.horizon.description = T2 medium standard combat aircraft, drops bombs on ground enemies directly below.
unit.zenith.description = T3 medium specialized combat aircraft, fires multiple homing missiles at enemies.
unit.antumbra.description = T4 heavy firepower combat aircraft, rapidly fires large bullets and homing missiles at enemies. Equipped with a frontal active ion shield to defend against incoming shells.
unit.eclipse.description = T5 heavy single-soldier combat aircraft, fires high-energy lasers and medium shells at enemies.
unit.mono.description = T1 light mining support drone, automatically mines copper and lead, can optionally mine additional minerals, and deposits them into the core.
unit.poly.description = T2 medium standard support combat drone, can be set to automatically rebuild destroyed buildings and assist other units in construction or automatically repair damaged buildings.
unit.mega.description = T3 medium specialized support aircraft, can be set to automatically rebuild destroyed buildings and assist other units in construction or automatically repair damaged buildings. Can carry 2x2 buildings and 2x2 ground units.
unit.quad.description = T4 heavy firepower support aircraft, drops plasma bombs on ground targets, can repair allied buildings and destroy enemies. Not recommended to set it to auto-rebuild, assist construction, or auto-repair. Can carry 3x3 ground units and 3x3 buildings.
unit.oct.description = T5 heavy single-soldier support aircraft, sacrifices weapons to protect nearby allied units with its force shield and four point-defense units, and repairs allied units in an area and grants a damage-resistance shield. Can carry 5.5x5.5 ground units and 5.5x5.5 buildings.
unit.risso.description = T1 light reconnaissance combat naval vessel, fires homing missiles and standard bullets at enemies.
unit.minke.description = T2 medium standard combat naval vessel, fires long-range shells and standard bullets at enemies.
unit.bryde.description = T3 medium specialized combat naval vessel, fires large long-range shells and homing missiles at enemies.
unit.sei.description = T4 heavy firepower combat naval vessel, fires multiple homing missiles and three-round bursts of armor-piercing bullets at enemies.
unit.omura.description = T5 heavy single-soldier combat naval vessel, fires long-range penetrating railgun bolts at enemies. Equipped with an automatic close-in weapon system to defend against nearby air units.
unit.alpha.description = T1 special operations base drone, protects the first-generation base core, can build and repair buildings.
unit.beta.description = T2 special operations base drone, protects the second-generation base core, can build and repair buildings.
unit.gamma.description = T3 special operations base drone, protects the third-generation base core, can build and repair buildings.
unit.retusa.description = T1 light reconnaissance support naval vessel, fires homing torpedoes and repair laser bolts at enemies. Repair laser bolts can repair allied buildings but do not repair autonomously. Equipped with a personal repair device to repair allied units.
unit.oxynoe.description = T2 medium standard support naval vessel, fires ion flame beams at enemies, can repair allied buildings but does not repair autonomously. Equipped with a point-defense turret that can defend against some incoming bullets to a certain extent.
unit.cyerce.description = T3 medium specialized support naval vessel, fires homing cluster missiles at enemies, can repair allied buildings but does not repair autonomously. Equipped with two personal repair devices to repair allied units.
unit.aegires.description = T4 heavy firepower support naval vessel, generates an electromagnetic energy field that damages enemy buildings and units within range with electric arcs, and repairs allies.
unit.navanax.description = T5 heavy single-soldier combat naval vessel, fires large electromagnetic explosive shells that cause major damage to enemy power grids, repairs allied buildings but does not repair autonomously, suppresses enemy repair buildings and slows enemy buildings. Can also use its main gun's electromagnetic shells to overdrive buildings. Equipped with an automatic rapid-fire laser gun and two rear missile launchers that fire repair-suppression missiles.

# Erekir
# Unit Descriptions
unit.stell.description = T1 light reconnaissance combat tank, fires standard shells at enemies.
unit.locus.description = T2 medium standard combat tank, fires alternating laser beams at enemies.
unit.precept.description = T3 medium specialized combat tank, fires penetrating cluster shells at enemies.
unit.vanquish.description = T4 heavy firepower combat tank, fires large penetrating splitting shells at enemies.
unit.conquer.description = T5 heavy single-soldier combat tank, fires large numbers of large penetrating bullets at enemies.
unit.merui.description = T1 light multi-legged reconnaissance combat mech, fires long-range plasma shells at ground enemies. Can traverse most terrain.
unit.cleroi.description = T2 medium standard combat mech, fires dual plasma shells at enemies. Equipped with two point-defense turrets that can defend against some incoming bullets to a certain extent. Can traverse most terrain.
unit.anthicus.description = T3 medium specialized combat mech, fires long-range guided missiles at enemies. Can traverse most terrain.
unit.tecta.description = T4 heavy firepower combat mech, fires plasma homing missiles at enemies. Uses its frontal ion shield to protect itself, can reflect some incoming bullets, and the shield self-repairs when damaged. Can traverse most terrain.
unit.collaris.description = T5 heavy single-soldier combat mech, fires long-range splitting plasma shells at enemies. Can traverse most terrain.
unit.elude.description = T1 light reconnaissance combat hovercraft, fires plasma spiral homing bullets at enemies. Can hover over liquids.
unit.avert.description = T2 medium standard combat aircraft, fires plasma spiral bullets at enemies.
unit.obviate.description = T3 medium specialized combat aircraft, fires plasma spiral lightning orbs at enemies.
unit.quell.description = T4 heavy firepower combat aircraft, fires long-range guided missiles at enemies. Can suppress enemy repair buildings.
unit.disrupt.description = T5 heavy single-soldier combat aircraft, fires long-range suppression guided missiles at enemies. Can suppress enemy repair buildings.
unit.evoke.description = T1 special operations reinforced drone, protects the Bastion base core, can build buildings. Uses laser beams to repair buildings. No attack capability.
unit.incite.description = T2 special operations reinforced drone, protects the Citadel base core, can build buildings. Uses laser beams to repair buildings. No attack capability.
unit.emanate.description = T3 special operations reinforced drone, protects the Acropolis base core, can build buildings. Uses twin laser beams to repair buildings. No attack capability.
unit.latum.description = A very big bug. On death, it bursts into five small bugs and a pile of neoplasm. Can absorb neoplasm to heal.
unit.renale.description = A very small bug. Self-regenerating. On death, releases a small amount of neoplasm. Can absorb neoplasm to heal.

