item.ss-raw-lead.name = 粗鉛

# 物品描述
item.ss-malachite.description = 伊甸星上最常見的礦物，開採後需要精煉為紅銅。可以建造基礎建築。
item.ss-raw-lead.description = 伊甸星上最常見的礦物，開採後需要精煉為灰鉛。可以建造基礎建築。

