# 單位描述
unit.ss-stell-serpulo.description = 蕈孢星特供T1輕型偵查戰鬥陸戰坦克，向敵軍發射標準砲彈。
unit.ss-elude-serpulo.description = 蕈孢星特供T1輕型偵查戰鬥陸戰懸浮飛艇，向敵人發射電漿螺旋追蹤彈。可以在液體上懸浮。
unit.ss-merui-serpulo.description = 蕈孢星特供T1輕型多足偵查戰鬥陸戰機甲，向地面敵軍發射遠程電漿砲彈。可以跨越大多數地形。

# 埃里克尔
# 邏輯用途描述
block.ss-reinforced-micro-processor.description = 循環運行一系列邏輯指令，可用於控制單位和建築物。
block.ss-reinforced-memory-cell.description = 存儲處理器的信息。
block.ss-reinforced-switch.description = 可切換的開關。開關狀態可以用邏輯處理器讀取和控制。

