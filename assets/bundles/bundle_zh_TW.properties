# 原版內容修改

# 賽普羅
# 單位用途描述
unit.dagger.description = T1輕型偵查陸戰機甲，向敵軍連續發射標準子彈。
unit.mace.description = T2中型標準戰鬥陸戰機甲，向敵軍噴射高溫火焰融化表面裝甲。
unit.fortress.description = T3中型特化火砲陸戰機甲，向地面敵軍發射遠程砲彈。
unit.scepter.description = T4重型火力戰鬥陸戰機甲，向敵軍快速連續發射電磁彈。
unit.reign.description = T5重型單兵作戰陸戰機甲，向敵軍發射三連發大型穿甲彈。
unit.nova.description = T1輕型輔助陸戰機甲，發射雷射彈攻擊敵軍，雷射彈可修復建築但不會自主修復，可以範圍修復我方單位。能夠助推快速行進，助推時不可攻擊。
unit.pulsar.description = T2中型標準輔助陸戰機甲，發射多條直線電弧麻痺敵軍，電弧可修復建築但不會自主修復，可為我方範圍內單位增加一定抗傷能力的臨時護盾。能夠助推快速行進，助推時不可攻擊。
unit.quasar.description = T3中型特化輔助陸戰機甲，發射高能雷射束穿透敵軍，雷射束可修復建築但不會自主修復。能夠助推快速行進，助推時不可攻擊。擁有單兵全息護盾，可阻擋來襲子彈，損毀時可自主恢復。
unit.vela.description = T4重型火力輔助陸戰機甲，發射巨大的持續高能雷射束熔化敵軍並引起燃燒，不可擅自指揮修復己方建築，以防止燃燒產生事故。能夠助推快速行進，助推時不可攻擊。搭載兩架修復裝置，可自主治療範圍內我方單位。
unit.corvus.description = T5重型多足單兵輔助陸戰機甲，蓄能並發射巨型高能雷射束將前方敵軍化為灰燼為我方單位開路，不建議指揮修復建築。捨棄了助推能力，加裝四條機械腿以跨越大多數地形。
unit.crawler.description = T1輕型多足量化自爆陸戰機甲，快速衝向敵軍並自毀，造成大範圍爆炸。
unit.atrax.description = T2中型標準多足戰鬥陸戰機甲，發射削弱性的球狀礦渣液熔化目標。可以跨越大多數地形。
unit.spiroct.description = T3中型多足特化戰鬥陸戰機甲，向敵軍發射牽引雷射束並弱化敵軍防禦，擊中目標會自我修復。可以跨越大多數地形。
unit.arkyid.description = T4重型多足火力戰鬥陸戰機甲，向敵軍發射大型牽引雷射束並弱化敵軍防禦擊中目標會自我修復，搭載兩門中型帶電集束砲發射器。可以跨越大多數地形。
unit.toxopid.description = T5重型多足單兵作戰陸戰機甲，向敵軍發射大型帶電集束砲彈與三岔高能雷射熔毀敵軍。可以跨越大多數地形。
unit.flare.description = T1輕型偵查戰鬥空戰戰機，向敵軍急速發射輕量化子彈。
unit.horizon.description = T2中型標準戰鬥空戰戰機，向正下方的地面敵軍投擲炸彈。
unit.zenith.description = T3中型特化戰鬥空戰戰機，向敵軍發射多枚追蹤飛彈。
unit.antumbra.description = T4重型火力戰鬥空戰戰機，向敵軍快速發射大型子彈與追蹤飛彈。附帶正面主動離子護盾防禦來襲砲彈。
unit.eclipse.description = T5重型單兵作戰空戰戰機，向敵人發射高能雷射與中型砲彈。
unit.mono.description = T1輕型礦業輔助空輔無人機，自動開採銅和鉛，可額外選擇挖取礦物，並將其放入核心中。
unit.poly.description = T2中型標準輔助空戰無人機，可設置自動重建被摧毀的建築並協助其他單位進行建造或自動修復受損建築。
unit.mega.description = T3中型特化輔助空戰飛機，可設置自動重建被摧毀的建築並協助其他單位進行建造或自動修復受損建築。能夠攜帶2×2尺寸的建築和2×2尺寸的地面單位。
unit.quad.description = T4重型火力輔助空戰飛機，向地面目標投擲電漿炸彈，可修復己方建築並摧毀敵人，不建議去設置自動重建、協助建造與自動修復。能夠攜帶3×3尺寸的地面單位與3×3尺寸的建築。
unit.oct.description = T5重型單兵輔助空戰飛機，捨棄了武器轉而用它的立場盾與四門單點式防禦單元保護附近的己方單位並範圍修復己方單位和給予一定抗傷能力的護盾。能夠攜帶5.5×5.5尺寸的地面單位與5.5×5.5尺寸的建築。
unit.risso.description = T1輕型偵查戰鬥海戰艦艇，向敵軍發射追蹤飛彈與標準子彈。
unit.minke.description = T2中型標準戰鬥海戰艦艇，向敵軍發射遠程砲彈和標準子彈。
unit.bryde.description = T3中型特化戰鬥海戰艦船，向敵軍發射大型遠程砲彈和追蹤飛彈。
unit.sei.description = T4重型火力戰鬥海戰艦船，向敵軍發射多發追蹤飛彈與三連發穿甲彈。
unit.omura.description = T5重型單兵作戰海戰艦船，向敵軍發射遠程穿透軌道砲。附帶自動近防機砲防禦周遭空軍。
unit.alpha.description = T1特種作戰基地無人機，保護基地核心：碎片，可建造與修復建築。
unit.beta.description = T2特種作戰基地無人機，保護基地核心：基地，可建造與修復建築。
unit.gamma.description = T3特種作戰基地無人機，保護基地核心：核子，可建造與修復建築。
unit.retusa.description = T1輕型偵查輔助海戰艦艇，向敵人發射追蹤魚雷與修復雷射彈，可修復己方建築但不會自主修復，搭載單兵修復儀修復己方單位。
unit.oxynoe.description = T2中型標準輔助海戰艦艇，向敵人發射離子火焰束，可修復己方建築但不會自主修復。搭載一台單點防禦砲塔，能夠一定程度防禦來襲的部分子彈。
unit.cyerce.description = T3中型特化輔助海戰艦船，向敵人發射追蹤集束飛彈，可修復己方建築但不會自主修復，搭載兩門單兵修復儀修復己方單位。
unit.aegires.description = T4重型火力輔助海戰艦船，產生電磁能量場，使範圍內的敵方建築與單位受到電弧攻擊，對己方則進行修復。
unit.navanax.description = T5重型單兵作戰海戰艦船，發射大型電磁爆彈，對敵方電網造成重大破壞，同時可修復友軍建築但不會自主修復，壓制敵方修復建築並減速敵方建築。也可用主砲的電磁爆彈超速建築。搭載自動攻擊連射雷射槍，後置兩台飛彈發射器發射修復廠壓制飛彈。

# 埃里克尔
# 單位用途描述
unit.stell.description = T1輕型偵查戰鬥陸戰坦克，向敵軍發射標準砲彈。
unit.locus.description = T2中型標準戰鬥陸戰坦克，向敵軍交替發射雷射束。
unit.precept.description = T3中型特化戰鬥陸軍坦克，向敵軍發射穿透集束砲彈。
unit.vanquish.description = T4重型火力戰鬥陸戰坦克，向敵軍發射大型穿透分裂砲彈。
unit.conquer.description = T5重型單兵作戰陸戰坦克，向敵人發射大量大型穿透性子彈。
unit.merui.description = T1輕型多足偵查戰鬥陸戰機甲，向地面敵軍發射遠程電漿砲彈。可以跨越大多數地形。
unit.cleroi.description = T2中型標準戰鬥陸戰機甲，向敵人發射雙發電漿砲彈。搭載兩台單點防禦砲台，能夠一定程度防禦來襲的部分子彈。可以跨越大多數地形。
unit.anthicus.description = T3中型特化戰鬥陸戰機甲，向敵人發射遠程制導飛彈。可以跨越大多數地形。
unit.tecta.description = T4重型火力戰鬥陸戰機甲，向敵人發射電漿追蹤飛彈。用它前方的離子護盾保護自己，可以反彈部分來襲子彈，護盾受損會自我修復。可以跨越大多數地形。
unit.collaris.description = T5重型單兵作戰陸戰機甲，向敵人發射遠程分裂電漿砲彈。可以跨越大多數地形。
unit.elude.description = T1輕型偵查戰鬥陸戰懸浮飛艇，向敵人發射電漿螺旋追蹤彈。可以在液體上懸浮。
unit.avert.description = T2中型標準戰鬥空戰飛艇，向敵人發射電漿螺旋彈。
unit.obviate.description = T3中型特化戰鬥空戰飛艇，向敵人發射電漿螺旋閃電球。
unit.quell.description = T4重型火力戰鬥空戰飛艇，向敵人發射遠程制導飛彈。能夠壓制敵方修復建築。
unit.disrupt.description = T5重型單兵作戰空戰飛艇，向敵人發射遠程壓制制導飛彈。能夠壓制敵方修復建築。
unit.evoke.description = T1特種作戰強化無人機，保護基地核心：碉堡，可建造建築。使用雷射束修復建築。無攻擊能力。
unit.incite.description = T2特種作戰強化無人機，保護基地核心：壁壘，可建造建築。使用雷射束修復建築。無攻擊能力。
unit.emanate.description = T3特種作戰強化無人機，保護基地核心：衛城，可建造建築。使用一對雷射束修復建築。無攻擊能力。
unit.latum.description = 賊大一隻蟲蟲，死亡爆出五隻小蟲蟲和一堆瘤液。可吸收瘤液回血。
unit.renale.description = 很小一隻蟲蟲，自我再生。死亡放出少量瘤液，可吸收瘤液回血。

