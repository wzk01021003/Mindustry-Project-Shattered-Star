# 建築描述
# 物流
block.ss-primitive-conveyor.description = 由未精煉的礦物建成的初代傳送帶。可以緩慢輸送物資。
block.ss-primitive-junction.description = 由未精煉的礦物建成的初代交叉器。可以讓物資交叉輸送。
block.ss-primitive-router.description = 由未精煉的礦物建成的初代路由器。可以讓物資平均分配。
block.ss-primitive-bridge-conveyor.description = 由未精煉的礦物建成的初代傳送帶橋。可以讓物資跨方塊輸送。

# 鑽頭
block.ss-primitive-mechanical-drill.description = 由未精煉的礦物建成的初代機械鑽頭，自動採集下方礦脈。效率低，耗材少。適用於前期。

# 區塊名稱
sector.ss-crash-site.name = 迫降點

# 區塊描述
sector.ss-crash-site.description = 你從近地軌道上被擊落，好在未知單位因天氣視野模糊，並未發覺基地核心未完全損壞。\n挖掘這片貧瘠山谷的基礎礦物並建立起初步防線。\n[red]——警告——[]\n該地帶有[red]未知單位[]帶領的巡邏隊巡邏，請務必在[accent]一定時間[]內建立起多重防線！

# 異構單位
# 單位名稱
unit.ss-flareAT.name = 異構-曳光
unit.ss-daggerAT.name = 異構-匕首
unit.ss-novaAT.name = 異構-超新星

# 單位描述
unit.ss-flareAT.description = AT1輕型偵查戰鬥空戰戰機，向敵軍發射三連發標準子彈。對比賽普羅單位有著速度、防禦、傷害上的提升。
unit.ss-daggerAT.description = AT1輕型偵查陸戰機甲，向敵軍連續發射雙發標準子彈。對比賽普羅單位有著速度、防禦、傷害上的提升。
unit.ss-novaAT.description = AT1輕型輔助陸戰機甲，發射雷射彈攻擊敵軍，雷射彈可修復建築但不會自主修復，可以範圍修復我方單位。能夠助推快速行進，助推時不可攻擊。對比賽普羅單位有著速度、防禦、傷害上的提升。

