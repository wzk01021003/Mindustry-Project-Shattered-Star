# 設定相關
setting.skipcoreanimation.description = 啟用後，核心發射/著陸動畫將會跳過。
setting.landscape.description = 啟用後，螢幕朝向會鎖定至橫向。
setting.blockreplace.description = 啟用後，放置同類方塊時會推薦可用的升級版本。
setting.linear.description = 啟用後，紋理會更加光滑；停用後，紋理會更加像素化。
setting.backgroundpause.description = 啟用後，若遊戲不在前景，則自動暫停。
setting.buildautopause.description = 啟用後，若玩家沒有主動建造，則自動關閉建造功能。
setting.doubletapmine.description = 啟用後，雙擊才能使單位開始採礦。
setting.commandmodehold.description = 是否需要按住指揮模式按鈕才能開啟指揮模式；若停用，單擊此按鈕會在指揮模式開啟或關閉間切換。
setting.distinctcontrolgroups.description = 啟用後，每個單位只能隸屬於一個編隊。
setting.modcrashdisable.description = 啟用後，若啟動時模組崩潰，則會停用所有模組以避免無止盡的崩潰。
setting.animatedwater.description = 是否顯示水、熔渣和護盾等表面的動畫。
setting.playerindicators.description = 在地圖上顯示標記，來指示其他玩家的方向。
setting.indicators.description = 在地圖上顯示標記，來指示其他敵人的方向。
setting.autotarget.description = 啟用後，單位會自動瞄準最近的敵人和開火。
setting.fpscap.description = 限制每秒最大幀數。設定過大可能會更加耗電。
setting.swapdiagonal.description = 啟用後，會預設切換到斜線建造模式。
setting.screenshake.description = 調節爆炸或其他事件使螢幕抖動的強度。
setting.bloomintensity.description = 調節泛光和自發光的強度。
setting.bloomblur.description = 調節泛光特效的模糊程度。
setting.effects.description = 是否開啟大部分的特效，如粒子特效與煙霧。
setting.destroyedblocks.description = 啟用後，被摧毀的方塊會留下廢墟。
setting.blockstatus.description = 在方塊上顯示標識狀態的顏色標誌。
setting.conveyorpathfinding.description = 啟用後，輸送帶會自動尋找到達終點的路徑。
setting.sensitivity.description = 調節遊戲控制器的靈敏度。
setting.saveinterval.description = 調整自動存檔的時間間隔。
setting.fps.description = 在螢幕角落中顯示每秒幀數與網路延遲。
setting.console.name = 啟用控制台
setting.console.description = 啟用遊戲內 JavaScript 控制台。
setting.smoothcamera.description = 啟用後，鏡頭會平滑轉動，而非瞬移到新位置。
setting.vsync.description = 將遊戲幀率與顯示器同步以防撕裂。
setting.pixelate.description = 啟用後，遊戲會以低解析度渲染，創造出像素風的顯示效果。
setting.minimap.description = 是否在螢幕角落顯示小地圖。
setting.coreitems.description = 是否在螢幕邊緣顯示物品儲存。
setting.position.description = 是否在螢幕上顯示玩家座標。
setting.mouseposition.description = 是否在螢幕上顯示滑鼠所指座標。
setting.atmosphere.description = 是否在戰役介面中渲染行星大氣層。
setting.communityservers.description = 啟動後，遊戲將獲取並顯示社群營運的伺服器列表。
setting.savecreate.description = 啟動後，遊戲會在開始新遊戲時自動建立存檔。
setting.steampublichost.description = 控制 Steam 伺服器的可見性。
setting.playerlimit.description = 設定伺服器的最大玩家數。
setting.chatopacity.description = 調節聊天框的透明度。
setting.lasersopacity.description = 調節電力連接線的透明度。
setting.unitlaseropacity.description = 調節單位採礦光束的透明度。
setting.bridgeopacity.description = 調節運輸橋的透明度。
setting.playerchat.description = 啟用後，將在玩家頭頂顯示聊天氣泡。
setting.showweather.description = 是否顯示天氣效果，如雨雪等。
setting.hidedisplays.description = 隱藏邏輯顯示器內容，可能會提升效能。
setting.logiclocalization.name = 邏輯本地化
setting.logiclocalization.description = 啟用後，邏輯編輯器中的文字會被翻譯，而不是所有語言都使用英文。