lcategory.control.description = 控制指令執行的順序。
lenum.flag = 賦予單位數字形式的旗標
lenum.paytake = 拾取當前位置的載荷
laccess.flag = 儲存在單位身上的旗標。
laccess.totalitems = 含有的物品總數。
laccess.firstitem = 含有的第一個物品，若為空則回傳 null。
laccess.totalliquids = 含有的液體總量。
laccess.totalpower = 對於能儲電的建築，指儲存的電量；對於其他建築，以 0 到 1 表示供電滿足率。
laccess.itemcapacity = 該建築可容納的最大物品數量。
laccess.liquidcapacity = 該建築可容納的最大液體量。
laccess.powercapacity = 該建築可儲存的最大電量。
laccess.powernetstored = 相連電網的總儲電量。
laccess.powernetcapacity = 相連電網的總儲電容量。
laccess.powernetin = 相連的電網每秒輸入的電力。
laccess.powernetout = 相連的電網每秒輸出的電力。
laccess.ammo = 砲塔當前的彈藥數量。
laccess.ammocapacity = 砲塔的最大彈藥量。
laccess.health = 當前生命值\n對於子彈，指其傷害值。
laccess.maxhealth = 最大生命值\n對於子彈，指其基礎傷害。
laccess.heat = 耗熱砲塔當前的熱量值，範圍為 0 到 1。
laccess.shield = 單位當前的護盾值。
laccess.armor = 護甲值；每次受擊時的固定傷害減免。
laccess.efficiency = 建築的運行效率，以 1 為標準值。
laccess.timescale = 影響建築的時間縮放倍率，其中 1 為正常速度。
laccess.rotation = 單位或砲塔的朝向角度（以度為單位）。\n對於大多數其他建築，朝向值為 0 到 3。
laccess.x = X 座標（以格為單位）。
laccess.y = Y 座標（以格為單位）。
laccess.velocityx = 單位的 X 軸速度，單位為格/秒。
laccess.velocityy = 單位的 Y 軸速度，單位為格/秒。
laccess.shootx = 單位或砲塔所瞄準目標的 X 座標。
laccess.shooty = 單位或砲塔所瞄準目標的 Y 座標。
laccess.camerax = 控制玩家鏡頭的 X 座標。
laccess.cameray = 控制玩家鏡頭的 Y 座標。
laccess.camerawidth = 控制玩家鏡頭的寬度（以格為單位）。
laccess.cameraheight = 控制玩家鏡頭的高度（以格為單位）。
laccess.solid = 普通陸地單位是否不可通過該建築。
laccess.range = 單位或砲塔的射程（以格為單位）。
laccess.shooting = 單位或砲塔當前是否正在射擊。
laccess.boosting = 單位當前是否處於助推狀態或正在飛越地形。
laccess.minex = 單位所採礦物的 X 地块座標，若未在採礦則為 -1。
laccess.miney = 單位所採礦物的 Y 地块座標，若未在採礦則為 -1。
laccess.mining = 單位是否正在進行採礦。
laccess.buildx = 單位正在建造的建築 X 座標，若未建造則為 -1。
laccess.buildy = 單位正在建造的建築 Y 座標，若未建造則為 -1。
laccess.pingx = 玩家標記的標記點位置的 X 座標，若未標記則為 null。
laccess.pingy = 玩家標記的標記點位置的 Y 座標，若未標記則為 null。
laccess.pingtext = 玩家標記的標記點文字內容，若無則為 null。
laccess.building = 正在建造的建築原始名稱，若無則為 null。
laccess.breaking = 正在拆除的建築原始名稱，若無則為 null。
laccess.team = 單位或建築的隊伍 ID。
laccess.flying = 單位當前是否正在飛行。
laccess.name = 控制該單位的玩家名稱，若無則為 null。
laccess.payloadcount = 當前持有的有效載荷數量。
laccess.payloadtype = 最後取得的有效載荷類型，若無則為 null。
laccess.totalpayload = 所有持有的有效載荷的總大小。
laccess.payloadcapacity = 單位或建築所能承載的最大綜合有效載荷大小。
laccess.selectedblock = 玩家當前在建築列表選中的方塊，若無則為 null。
laccess.selectedrotation = 玩家當前在建築列表選擇的建造旋轉角度，範圍為 0 到 3。
laccess.bulletlifetime = 子彈可存在的總時長（以 tick 為單位）。
laccess.bullettime = 子彈已存在的時長（以 tick 為單位）。
