block.ss-ore-raw-lead.name = 粗铅矿

# 物品名称
item.ss-malachite.name = 孔雀石
item.ss-raw-lead.name = 粗铅

# 物品描述
item.ss-malachite.description = 赛普洛斯上最常见的矿物，开采后需要精炼为红铜。可以建造基础建筑。
item.ss-raw-lead.description = 赛普洛斯上最常见的矿物，开采后需要精炼为灰铅。可以建造基础建筑。

# 建筑名称
