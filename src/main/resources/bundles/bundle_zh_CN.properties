# 塞普罗
# 工厂用途描述
block.ss-metaglass-smelter.description = 把沙子和铅高效熔炼为钢化玻璃。

# 单位描述
unit.ss-stell-serpulo.description = 塞普罗特供T1轻型侦查战斗陆战坦克，向敌军发射标准炮弹。
unit.ss-elude-serpulo.description = 塞普罗特供T1轻型侦查战斗陆战悬浮飞艇，向敌人发射等离子螺旋追踪弹。可以在液体上悬浮。
unit.ss-merui-serpulo.description = 塞普罗特供T1轻型多足侦查战斗陆战机甲，向地面敌军发射远程等离子炮弹。可以跨越大多数地形。

# 埃里克尔
# 逻辑用途描述
block.ss-reinforced-micro-processor.description = 循环运行一系列逻辑指令，可用于控制单位和建筑物。
block.ss-reinforced-memory-cell.description = 存储处理器的信息。
block.ss-reinforced-switch.description = 可切换的开关。开关状态可以用逻辑处理器读取和控制。

# 赛普洛斯
# 星球名称
planet.ss-serpulos.name = 赛普洛斯

