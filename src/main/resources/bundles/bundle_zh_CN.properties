block.ss-primitive-conveyor.name = 初代传送带
block.ss-primitive-junction.name = 初代交叉器
block.ss-primitive-router.name = 初代路由器
block.ss-primitive-bridge-conveyor.name = 初代传送带桥

# 钻头
block.ss-primitive-mechanical-drill.name = 初代机械钻头

# 建筑描述
# 物流
block.ss-primitive-conveyor.description = 由未精炼的矿物建成的初代传送带。可以缓慢输送物资。
block.ss-primitive-junction.description = 由未精炼的矿物建成的初代交叉器。可以让物资交叉输送。
block.ss-primitive-router.description = 由未精炼的矿物建成的初代路由器。可以让物资平均分配。
block.ss-primitive-bridge-conveyor.description = 由未精炼的矿物建成的初代传送带桥。可以让物资跨方块输送。

# 钻头
block.ss-primitive-mechanical-drill.description = 由未精炼的矿物建成的初代机械钻头，自动采集下方矿脉。效率低，耗材少。适用于前期。

# 区块名称
sector.ss-crash-site.name = 迫降点

# 区块描述
sector.ss-crash-site.description = 你从近地轨道上被击落，好在未知单位因天气视野模糊，并未发觉基地核心未完全损坏。\n挖掘这片贫瘠山谷的基础矿物并建立起初步防线。\n[red]——警告——[]\n该地带有[red]未知单位[]带领的巡逻队巡逻，请务必在[accent]一定时间[]内建立起多重防线！

# 异构单位
# 单位名称
unit.ss-flareAT.name = 异构-星辉
unit.ss-daggerAT.name = 异构-尖刀
unit.ss-novaAT.name = 异构-新星

# 单位描述
unit.ss-flareAT.description = AT1轻型侦查战斗空战战机，向敌军发射三连发标准子弹。对比塞普罗单位有着速度、防御、伤害上的提升。
unit.ss-daggerAT.description = AT1轻型侦查陆战机甲，向敌军连续发射双发标准子弹。对比塞普罗单位有着速度、防御、伤害上的提升。
unit.ss-novaAT.description = AT1轻型辅助陆战机甲，发射激光弹攻击敌军，激光弹可修复建筑但不会自主修复，可以范围修复我方单位。能够助推快速行进，助推时不可攻击。对比塞普罗单位有着速度、防御、伤害上的提升。

# 原版内容修改

# 塞普罗
# 单位用途描述
unit.dagger.description = T1轻型侦查陆战机甲，向敌军连续发射标准子弹。
unit.mace.description = T2中型标准战斗陆战机甲，向敌军喷射高温火焰融化表面装甲。
unit.fortress.description = T3中型特化火炮陆战机甲，向地面敌军发射远程炮弹。
unit.scepter.description = T4重型火力战斗陆战机甲，向敌军快速连续发射电磁弹。
unit.reign.description = T5重型单兵作战陆战机甲，向敌军发射三连发大型穿甲弹。
unit.nova.description = T1轻型辅助陆战机甲，发射激光弹攻击敌军，激光弹可修复建筑但不会自主修复，可以范围修复我方单位。能够助推快速行进，助推时不可攻击。
unit.pulsar.description = T2中型标准辅助陆战机甲，发射多条直线电弧麻痹敌军，电弧可修复建筑但不会自主修复，可为我方范围内单位增加一定抗伤能力的临时护盾。能够助推快速行进，助推时不可攻击。
unit.quasar.description = T3中型特化辅助陆战机甲，发射高能激光束穿透敌军，激光束可修复建筑但不会自主修复。能够助推快速行进，助推时不可攻击。拥有单兵全息护盾，可阻挡来袭子弹，损毁时可自主恢复。
unit.vela.description = T4重型火力辅助陆战机甲，发射巨大的持续高能激光束熔化敌军并引起燃烧，不可擅自指挥修复己方建筑，以防止燃烧产生事故。能够助推快速行进，助推时不可攻击。搭载两架修复装置，可自主治疗范围内我方单位。
unit.corvus.description = T5重型多足单兵辅助陆战机甲，蓄能并发射巨型高能激光束将前方敌军化为灰烬为我方单位开路，不建议指挥修复建筑。舍弃了助推能力，加装四条机械腿以跨越大多数地形。
unit.crawler.description = T1轻型多足量化自爆陆战机甲，快速冲向敌军并自毁，造成大范围爆炸。
unit.atrax.description = T2中型标准多足战斗陆战机甲，发射削弱性的球状矿渣液熔化目标。可以跨越大多数地形。
unit.spiroct.description = T3中型多足特化战斗陆战机甲，向敌军发射牵引激光束并弱化敌军防御，击中目标会自我修复。可以跨越大多数地形。
unit.arkyid.description = T4重型多足火力战斗陆战机甲，向敌军发射大型牵引激光束并弱化敌军防御击中目标会自我修复，搭载两门中型带电集束炮发射器。可以跨越大多数地形。
unit.toxopid.description = T5重型多足单兵作战陆战机甲，向敌军发射大型带电集束炮弹与三岔高能激光熔毁敌军。可以跨越大多数地形。
unit.flare.description = T1轻型侦查战斗空战战机，向敌军急速发射轻量化子弹。
unit.horizon.description = T2中型标准战斗空战战机，向正下方的地面敌军投掷炸弹。
unit.zenith.description = T3中型特化战斗空战战机，向敌军发射多枚追踪导弹。
unit.antumbra.description = T4重型火力战斗空战战机，向敌军快速发射大型子弹与追踪导弹。附带正面主动离子护盾防御来袭炮弹。
unit.eclipse.description = T5重型单兵作战空战战机，向敌人发射高能激光与中型炮弹。
unit.mono.description = T1轻型矿业辅助空辅无人机，自动开采铜和铅，可额外选择挖取矿物，并将其放入核心中。
unit.poly.description = T2中型标准辅助空战无人机，可设置自动重建被摧毁的建筑并协助其他单位进行建造或自动修复受损建筑。
unit.mega.description = T3中型特化辅助空战飞机，可设置自动重建被摧毁的建筑并协助其他单位进行建造或自动修复受损建筑。能够携带2×2尺寸的建筑和2×2尺寸的地面单位。
unit.quad.description = T4重型火力辅助空战飞机，向地面目标投掷等离子炸弹，可修复己方建筑并摧毁敌人，不建议去设置自动重建、协助建造与自动修复。能够携带3×3尺寸的地面单位与3×3尺寸的建筑。
unit.oct.description = T5重型单兵辅助空战飞机，舍弃了武器转而用它的立场盾与四门单点式防御单元保护附近的己方单位并范围修复己方单位和给予一定抗伤能力的护盾。能够携带5.5×5.5尺寸的地面单位与5.5×5.5尺寸的建筑。
unit.risso.description = T1轻型侦查战斗海战舰艇，向敌军发射追踪导弹与标准子弹。
unit.minke.description = T2中型标准战斗海战舰艇，向敌军发射远程炮弹和标准子弹。
unit.bryde.description = T3中型特化战斗海战舰船，向敌军发射大型远程炮弹和追踪导弹。
unit.sei.description = T4重型火力战斗海战舰船，向敌军发射多发追踪导弹与三连发穿甲弹。
unit.omura.description = T5重型单兵作战海战舰船，向敌军发射远程穿透轨道炮。附带自动近防机炮防御周遭空军。
unit.alpha.description = T1特种作战基地无人机，保护初代基地核心，可建造与修复建筑。
unit.beta.description = T2特种作战基地无人机，保护次代基地核心,可建造与修复建筑。
unit.gamma.description = T3特种作战基地无人机，保护终代基地核心，可建造与修复建筑。
unit.retusa.description = T1轻型侦查辅助海战舰艇，向敌人发射追踪鱼雷与修复激光弹，可修复己方建筑但不会自主修复，搭载单兵修复仪修复己方单位。
unit.oxynoe.description = T2中型标准辅助海战舰艇，向敌人发射离子火焰束，可修复己方建筑但不会自主修复。搭载一台单点防御炮塔，能够一定程度防御来袭的部分子弹。
unit.cyerce.description = T3中型特化辅助海战舰船，向敌人发射追踪集束导弹，可修复己方建筑但不会自主修复，搭载两门单兵修复仪修复己方单位。
unit.aegires.description = T4重型火力辅助海战舰船，产生电磁能量场，使范围内的敌方建筑与单位受到电弧攻击，对己方则进行修复。
unit.navanax.description = T5重型单兵作战海战舰船，发射大型电磁爆弹，对敌方电网造成重大破坏，同时可修复友军建筑但不会自主修复，压制敌方修复建筑并减速敌方建筑。也可用主炮的电磁爆弹超速建筑。搭载自动攻击连射激光枪，后置两台导弹发射器发射修复厂压制导弹。

# 埃里克尔
# 单位用途描述
unit.stell.description = T1轻型侦查战斗陆战坦克，向敌军发射标准炮弹。
unit.locus.description = T2中型标准战斗陆战坦克，向敌军交替发射激光束。
unit.precept.description = T3中型特化战斗陆军坦克，向敌军发射穿透集束炮弹。
unit.vanquish.description = T4重型火力战斗陆战坦克，向敌军发射大型穿透分裂炮弹。
unit.conquer.description = T5重型单兵作战陆战坦克，向敌人发射大量大型穿透性子弹。
unit.merui.description = T1轻型多足侦查战斗陆战机甲，向地面敌军发射远程等离子炮弹。可以跨越大多数地形。
unit.cleroi.description = T2中型标准战斗陆战机甲，向敌人发射双发等离子炮弹。搭载两台单点防御炮台，能够一定程度防御来袭的部分子弹。可以跨越大多数地形。
unit.anthicus.description = T3中型特化战斗陆战机甲，向敌人发射远程制导导弹。可以跨越大多数地形。
unit.tecta.description = T4重型火力战斗陆战机甲，向敌人发射等离子追踪导弹。用它前方的离子护盾保护自己，可以反弹部分来袭子弹，护盾受损会自我修复。可以跨越大多数地形。
unit.collaris.description = T5重型单兵作战陆战机甲，向敌人发射远程分裂等离子炮弹。可以跨越大多数地形。
unit.elude.description = T1轻型侦查战斗陆战悬浮飞艇，向敌人发射等离子螺旋追踪弹。可以在液体上悬浮。
unit.avert.description = T2中型标准战斗空战飞艇，向敌人发射等离子螺旋弹。
unit.obviate.description = T3中型特化战斗空战飞艇，向敌人发射等离子螺旋闪电球。
unit.quell.description = T4重型火力战斗空战飞艇，向敌人发射远程制导导弹。能够压制敌方修复建筑。
unit.disrupt.description = T5重型单兵作战空战飞艇，向敌人发射远程压制制导导弹。能够压制敌方修复建筑。
unit.evoke.description = T1特种作战强化无人机保护城堡基地核心，可建造建筑。使用激光束修复建筑。无攻击能力。
unit.incite.description = T2特种作战强化无人机，保护堡垒基地核心，可建造建筑。使用激光束修复建筑。无攻击能力。
unit.emanate.description = T3特种作战强化无人机保护卫城基地核心，可建造建筑。使用一对激光束修复建筑。无攻击能力。
unit.latum.description = 贼大一只虫虫，死亡爆出五只小虫虫和一堆瘤液。可吸收瘤液回血。
unit.renale.description = 很小一只虫虫，自我再生。死亡放出少量瘤液，可吸收瘤液回血

